  if (/Cheese|Dairy|Milk|Cream|Ice Cream|Butter/i.test(cat)) return 'Dairy & Cheese';
  if (/Meat|Slaughter|Poultry|Render/i.test(cat)) return 'Meat & Rendering';
  if (/Distill/i.test(cat)) return 'Distilleries';
  if (/Sugar|Confect|Chocolate/i.test(cat)) return 'Sugar & Confectionery';
  return 'Other Food Mfg';
}

// ============================================================
// MARKERS
// ============================================================
let markers = [];
let activeFilters = new Set();
let activeIndustryFilters = new Set();
let searchTerm = '';

function getRadius(vol) {
  if (vol >= 100000) return 16;
  if (vol >= 50000) return 13;
  if (vol >= 10000) return 10;
  if (vol >= 5000) return 8;
  if (vol >= 1000) return 6;
  return 4;
}

function createMarkers() {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];

  const filtered = getFilteredFacilities();

  filtered.forEach(f => {
    const r = getRadius(f.volume);
    const marker = L.circleMarker([f.lat, f.lon], {
      radius: r,
      fillColor: f.color,
      fillOpacity: 0.7,
      color: f.color,
      weight: 1.5,
      opacity: 0.9,
    }).addTo(map);

    const volStr = f.volume > 0 ? f.volume.toLocaleString() : 'N/A';
    const statusColor = STATUS_COLORS[f.customerStatus] || '#6B7280';
    const matchLine = f.matchedTo ? `<div class="popup-row"><span class="popup-label">Matched To</span><span class="popup-value">${f.matchedTo}</span></div>` : '';
    marker.bindPopup(`
      <div class="popup-title">${f.parent}</div>
      <div class="popup-row"><span class="popup-label">Customer Status</span><span class="popup-value" style="color:${statusColor};font-weight:600;">${f.customerStatus}</span></div>
      ${matchLine}
      <div class="popup-row"><span class="popup-label">Location</span><span class="popup-value">${f.address !== 'N/A' ? f.address + ', ' : ''}${f.city}, ${f.state}</span></div>
      <div class="popup-row"><span class="popup-label">Industry</span><span class="popup-value">${f.simpleCategory}</span></div>
      <div class="popup-row"><span class="popup-label">NAICS Category</span><span class="popup-value">${f.category}</span></div>
      <div class="popup-row"><span class="popup-label">Est. Volume</span><span class="popup-vol">${volStr} tons</span></div>
      <div class="popup-row"><span class="popup-label">HS Confidence</span><span class="popup-value">${f.hsConfidence}</span></div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(56,189,248,0.15);">
        <div class="popup-label" style="margin-bottom:4px;color:#38BDF8;">Predicted ≥14% TS Streams (with COD)</div>
        <div style="color:#B8D4E8;font-size:11px;line-height:1.5;">${f.hsStreams}</div>
      </div>
      <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(56,189,248,0.1);">
        <div class="popup-label" style="margin-bottom:4px;color:#7B8FA3;">Below 14% TS (not high-strength)</div>
        <div style="color:#5A7A94;font-size:11px;line-height:1.4;">${f.belowThreshold}</div>
      </div>
    `, { maxWidth: 420 });

    markers.push({ marker, data: f });
  });

  updateStats(filtered);
  updateList(filtered);
}

function getFilteredFacilities() {
  return FACILITIES.filter(f => {
    if (activeFilters.size > 0 && !activeFilters.has(f.customerStatus)) return false;
    if (activeIndustryFilters.size > 0 && !activeIndustryFilters.has(f.simpleCategory)) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      return f.parent.toLowerCase().includes(s) ||
             f.city.toLowerCase().includes(s) ||
             f.category.toLowerCase().includes(s);
    }
    return true;
  });
}

// ============================================================
// STATS
// ============================================================
function updateStats(filtered) {
  const companies = new Set(filtered.map(f => f.parent));
  const totalVol = filtered.reduce((s, f) => s + f.volume, 0);
  document.getElementById('stat-companies').textContent = companies.size;
  document.getElementById('stat-sites').textContent = filtered.length;
  document.getElementById('stat-volume').textContent = totalVol >= 1000000
    ? (totalVol / 1000000).toFixed(1) + 'M'
    : totalVol >= 1000
    ? (totalVol / 1000).toFixed(0) + 'K'
    : totalVol;
}

// ============================================================
// CATEGORY FILTERS
// ============================================================
function buildFilters() {
  const container = document.getElementById('category-filters');
  const counts = {};
  FACILITIES.forEach(f => { counts[f.customerStatus] = (counts[f.customerStatus] || 0) + 1; });

  const order = ['Customer', 'Opportunity Created', 'Qualified', 'Prospect', 'First Contact', 'Not Found'];
  order.forEach(status => {
    if (!counts[status]) return;
    const pill = document.createElement('div');
    pill.className = 'pill active';
    const dotColor = STATUS_COLORS[status] || '#6B7280';
    pill.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:5px;"></span>${status}<span class="count">${counts[status]}</span>`;
    pill.dataset.cat = status;
    pill.addEventListener('click', () => {
      pill.classList.toggle('active');
      activeFilters.clear();
      const pills = container.querySelectorAll('.pill:not(.active)');
      if (pills.length > 0 && pills.length < order.length) {
        container.querySelectorAll('.pill.active').forEach(p => activeFilters.add(p.dataset.cat));
      }
      createMarkers();
    });
    container.appendChild(pill);
  });
}

const INDUSTRY_COLORS = {
  'Dairy & Cheese': '#0369A1',
  'Meat & Rendering': '#DC2626',
  'Sugar & Confectionery': '#D97706',
  'Distilleries': '#7C3AED',
  'Other Food Mfg': '#059669',
};

function buildIndustryFilters() {
  const container = document.getElementById('industry-filters');
  const counts = {};
  FACILITIES.forEach(f => { counts[f.simpleCategory] = (counts[f.simpleCategory] || 0) + 1; });

  const order = ['Dairy & Cheese', 'Meat & Rendering', 'Other Food Mfg', 'Sugar & Confectionery', 'Distilleries'];
  order.forEach(cat => {
    if (!counts[cat]) return;
    const pill = document.createElement('div');
    pill.className = 'pill active';
    const dotColor = INDUSTRY_COLORS[cat] || '#6B7280';
    pill.innerHTML = `${cat}<span class="count">${counts[cat]}</span>`;
    pill.dataset.cat = cat;
    pill.addEventListener('click', () => {
      pill.classList.toggle('active');
      activeIndustryFilters.clear();
      const pills = container.querySelectorAll('.pill:not(.active)');
      if (pills.length > 0 && pills.length < order.length) {
        container.querySelectorAll('.pill.active').forEach(p => activeIndustryFilters.add(p.dataset.cat));
      }
      createMarkers();
    });
    container.appendChild(pill);
  });

function updateList(filtered) {
  const container = document.getElementById('facility-list');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">No facilities match your filters</div>';
    return;
  }

  // Sort individual facilities by volume descending
  const sorted = [...filtered].sort((a, b) => b.volume - a.volume);

  container.innerHTML = '';
  sorted.forEach(f => {
    const item = document.createElement('div');
    item.className = 'facility-item';
    const volStr = f.volume > 0 ? f.volume.toLocaleString() + ' tons' : 'N/A';
    const addr = f.address && f.address !== 'N/A' ? f.address + ', ' : '';
    item.innerHTML = `
      <div class="fi-name">${f.parent}</div>
      <div class="fi-location">${addr}${f.city}, ${f.state}</div>
      <div class="fi-meta">
        <span class="fi-category" style="color:${f.color};border:1px solid ${f.color}33;background:${f.color}15;">${f.customerStatus}</span>
        <span class="fi-volume">${volStr}</span>
      </div>
    `;
    item.addEventListener('click', () => {
      map.setView([f.lat, f.lon], 13);
      const m = markers.find(mk => mk.data.lat === f.lat && mk.data.lon === f.lon);
      if (m) m.marker.openPopup();
      container.querySelectorAll('.facility-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
    container.appendChild(item);
  });
}

// ============================================================
// SEARCH
// ============================================================
document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  createMarkers();
});

// ============================================================
// INIT
// ============================================================
buildFilters();
buildIndustryFilters();
createMarkers();
</script>
